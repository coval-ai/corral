name: Submit a test set
description: Bring a scenario for us to benchmark voice AI models on.
title: "[Test set] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for bringing a test set. Submissions are public. We review each one and may add it to `community-test-sets/` and run it on our public harness.
  - type: input
    id: name
    attributes:
      label: Test set name
      description: Short and descriptive, e.g. "Pharmacy refill with a noisy caller".
    validations:
      required: true
  - type: dropdown
    id: model-type
    attributes:
      label: Model type
      description: Which leaderboard this belongs to.
      options:
        - Speech-to-speech
        - Text-to-speech
        - Speech-to-text
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: The real-world situation and why current benchmarks miss it.
    validations:
      required: true
  - type: textarea
    id: persona
    attributes:
      label: Caller persona
      description: "Who is calling: goal, tone, accent, background noise."
    validations:
      required: true
  - type: textarea
    id: test-cases
    attributes:
      label: Test cases
      description: One per line. What the caller says, then what counts as a pass.
    validations:
      required: true
  - type: textarea
    id: success-criteria
    attributes:
      label: Success criteria
      description: How a judge decides pass or fail from the transcript alone.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Before you submit
      options:
        - label: This contains no real customer data or personal information.
          required: true
        - label: I'm OK with this being public and used in Coval benchmarks.
          required: true
