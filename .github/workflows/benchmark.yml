# Generated by scripts/gen_benchmark_workflow.py from the model catalogs, the scenario
# directories and .github/benchmarks.json. Edit those and commit; a pre-commit hook rewrites
# this file and CI checks it's current.

name: Benchmark
run-name: ${{ inputs.scenario }} · ${{ inputs.stack }} · ${{ inputs.size }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Coval scenario, or a scenario directory in the repo
        type: choice
        options: ["bank.v1", "workflow-bank.v1", "id-roulette.v1", "id_roulette (repo)"]
        default: "bank.v1"
      stack:
        description: One native model, or a cascade as STT + LLM + TTS
        type: choice
        options: ["openai/gpt-realtime-2.1", "openai/gpt-realtime-2.1-mini", "openai/gpt-live-1", "google/gemini-3.8-live", "google/gemini-3.8-live-extended-thinking", "xai/grok-voice-3.0", "elevenlabs/eleven_realtime_v1_mini", "elevenlabs/eleven_realtime_v1_max", "deepgram/nova-3 + openai/gpt-4.1 + elevenlabs/eleven_flash_v2", "soniox/stt-rt-v5 + google/gemini-2.5-flash + elevenlabs/eleven_flash_v2", "xai/grok-voice-transcribe-2.0 + xai/grok-4.20-non-reasoning + xai/grok-tts"]
        default: "openai/gpt-realtime-2.1"
      size:
        description: How much of the suite to run
        type: choice
        options: ["smoke", "sample 5", "full"]
        default: "smoke"
      personas:
        description: The suite's first persona, all of them, or manifest persona keys joined by commas
        type: choice
        options: ["default", "all"]
        default: "default"
  workflow_call:
    inputs:
      scenario:
        description: Coval scenario, or a scenario directory in the repo
        type: string
        default: "bank.v1"
      stack:
        description: One native model, or a cascade as STT + LLM + TTS
        type: string
        default: "openai/gpt-realtime-2.1"
      size:
        description: How much of the suite to run
        type: string
        default: "smoke"
      personas:
        description: The suite's first persona, all of them, or manifest persona keys joined by commas
        type: string
        default: "default"

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: gcp
    timeout-minutes: 130
    steps:
      - name: Turn the picks into corral flags
        id: flags
        env:
          SCENARIO: ${{ inputs.scenario }}
          STACK: ${{ inputs.stack }}
          SIZE: ${{ inputs.size }}
          PERSONAS: ${{ inputs.personas }}
        run: |
          args=(benchmark)
          add() {
            if [[ ! "$2" =~ ^[A-Za-z0-9._/,-]+$ ]]; then
              echo "::error::$1 has characters a model or scenario name can't have: $2"
              exit 1
            fi
            args+=("$1" "$2")
          }
          if [[ "$SCENARIO" == *" (repo)" ]]; then
            add --scenario "${SCENARIO% (repo)}"
          else
            add --assets "$SCENARIO"
            case "$SCENARIO" in
            "bank.v1") add --prompt-from "openai/gpt-realtime-2" ;;
            "workflow-bank.v1") add --prompt-from "openai/gpt-realtime-2" ;;
            "id-roulette.v1") add --prompt-from "livekit/pinned" ;;
            esac
          fi
          if [[ "$STACK" == *" + "* ]]; then
            IFS='+' read -r stt llm tts <<< "${STACK// /}"
            add --stt "$stt"
            add --llm "$llm"
            add --tts "$tts"
          else
            add --s2s "$STACK"
          fi
          case "$SIZE" in
            smoke) args+=(--smoke) ;;
            "sample "*) add --sample "${SIZE#sample }" ;;
            full) args+=(--full) ;;
            *) echo "::error::size must be smoke, sample N or full: $SIZE"; exit 1 ;;
          esac
          [ "$PERSONAS" != "default" ] && add --personas "$PERSONAS"
          echo "command=corral ${args[*]}" >> "$GITHUB_OUTPUT"
          echo "joined=$(IFS=';'; echo "${args[*]}")" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_RUN_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Run the corral job
        id: run
        env:
          COMMAND: ${{ steps.flags.outputs.command }}
          JOINED: ${{ steps.flags.outputs.joined }}
        run: |
          echo "$COMMAND"
          project=$(gcloud config get-value project 2>/dev/null)
          set +e
          gcloud run jobs execute corral --region us-east1 --wait --args="^;^${JOINED}" 2>&1 \
            | tee execute.log
          status=${PIPESTATUS[0]}
          set -e
          execution=$(grep -oE 'Execution \[[^]]+\]' execute.log | head -1 | tr -d '[]' \
            | cut -d' ' -f2 || true)
          image=""
          if [ -n "$execution" ]; then
            image=$(gcloud run jobs executions describe "$execution" --region us-east1 \
              --format='value(spec.template.spec.containers[0].image)' || true)
          fi
          console=https://console.cloud.google.com/run/jobs/executions/details/us-east1
          logs="$console/${execution}/logs?project=${project}"
          {
            echo '```'
            echo "$COMMAND"
            echo '```'
            echo
            if [ -n "$execution" ]; then
              echo "Cloud Run execution [\`$execution\`]($logs)"
            else
              echo "The job didn't start; see the step log above."
            fi
            echo
            echo "Image \`${image:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
