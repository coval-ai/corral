[project]
name = "benchmark-harness"
version = "0.1.0"
description = "Coval's own agent for the S2S benchmarks: Pipecat stacks served to Coval's simulator"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "structlog>=24",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=13,<14",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "pipecat-ai[deepgram,elevenlabs,google,openai,silero,soniox,websocket]~=1.12",
]

[project.optional-dependencies]
local = ["pipecat-ai[local]~=1.12"]  # mic and speakers; needs portaudio

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "UP", "SIM", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pipecat.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
