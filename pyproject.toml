[project]
name = "benchmark-harness"
version = "0.1.0"
description = "Coval's own agent for the S2S benchmarks: Pipecat stacks run against Coval's simulator"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "loguru>=0.7",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "pipecat-ai[deepgram,elevenlabs,google,openai,silero,soniox] @ https://github.com/pipecat-ai/pipecat/archive/00cad1894fd917acee1fce6136b54ec60dbb1ade.tar.gz#sha256=3bbe53da7408c0b270bc592c6d7b7ef76ec2a69026ca1e2ec8fd07f281a8e485",
    "coval-agent-sdk>=0.1.0,<0.2",
    "google-auth[requests]>=2.62.0",
]

[project.urls]
Source = "https://github.com/coval-ai/benchmark-harness"
Documentation = "https://github.com/coval-ai/benchmark-harness#readme"
Issues = "https://github.com/coval-ai/benchmark-harness/issues"

[project.scripts]
corral = "corral.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "mypy>=1.10",
    "ruff>=0.5",
    "miniaudio>=1.60",
    "livekit>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corral"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "UP", "SIM", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pipecat.*", "livekit.*", "miniaudio"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
filterwarnings = [
    "error",
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:`AudioContextTTSService` is deprecated:DeprecationWarning",
]

[tool.hatch.metadata]
allow-direct-references = true
